<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalmonScan</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --ok: #22c55e; --bad: #ef4444; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  #drop { border: 2px dashed var(--muted); border-radius: 14px; padding: 40px 16px;
          text-align: center; cursor: pointer; transition: .15s; background: var(--card); }
  #drop.hover { border-color: var(--accent); background: #0b2540; }
  #drop strong { color: var(--accent); }
  button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px;
           background: var(--accent); color: #04111f; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 12px; color: var(--muted); min-height: 1.4em; }
  .grid { display: grid; gap: 16px; margin-top: 24px; }
  .item { display: grid; grid-template-columns: 220px 1fr; gap: 16px; background: var(--card);
          border-radius: 12px; overflow: hidden; border-left: 6px solid var(--muted); }
  .item.fresh { border-left-color: var(--ok); }
  .item.infected { border-left-color: var(--bad); }
  .item img { width: 100%; height: 100%; object-fit: cover; min-height: 110px; }
  .info { padding: 14px 14px 14px 0; }
  .name { color: var(--muted); font-size: .85rem; word-break: break-all; }
  .label { font-size: 1.3rem; font-weight: 700; margin: 4px 0 8px; }
  .fresh .label { color: var(--ok); } .infected .label { color: var(--bad); }
  .bar { height: 10px; background: #334155; border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bad); }
  .pct { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; }
  @media (max-width: 560px) { .item { grid-template-columns: 1fr; } .info { padding: 0 14px 14px; } }
</style>
</head>
<body>
<main>
  <h1>🐟 SalmonScan</h1>
  <p class="sub">อัปโหลดรูปปลาแซลมอนเพื่อทายว่า ปกติ (Fresh) หรือ ติดเชื้อ (Infected)</p>

  <div id="drop">
    ลากรูปมาวางที่นี่ หรือ <strong>คลิกเพื่อเลือกไฟล์</strong> (เลือกได้หลายรูป)
    <input id="file" type="file" accept="image/png,image/jpeg" multiple hidden>
  </div>
  <button id="go" disabled>ตรวจสอบ</button>
  <div id="status"></div>
  <div id="out" class="grid"></div>

  <footer>โมเดลเพื่อการศึกษา (SVM + Color histogram) ไม่ใช่เครื่องมือวินิจฉัยโรคจริง</footer>
</main>

<script>
const drop = document.getElementById("drop");
const input = document.getElementById("file");
const go = document.getElementById("go");
const out = document.getElementById("out");
const statusEl = document.getElementById("status");
let selected = [];

drop.addEventListener("click", () => input.click());
input.addEventListener("change", () => setFiles(input.files));
["dragover", "dragenter"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add("hover");
}));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove("hover");
}));
drop.addEventListener("drop", ev => setFiles(ev.dataTransfer.files));

function setFiles(list) {
  selected = Array.from(list).filter(f => /^image\/(png|jpeg)$/.test(f.type));
  go.disabled = selected.length === 0;
  statusEl.textContent = selected.length ? `เลือกแล้ว ${selected.length} รูป` : "ไม่พบไฟล์ PNG/JPG";
  out.innerHTML = "";
}

go.addEventListener("click", async () => {
  go.disabled = true;
  statusEl.textContent = "กำลังตรวจสอบ...";
  out.innerHTML = "";
  const fd = new FormData();
  selected.forEach(f => fd.append("files", f));
  try {
    const res = await fetch("/predict", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "เกิดข้อผิดพลาด");
    render(data.results);
    statusEl.textContent = "เสร็จแล้ว";
  } catch (err) {
    statusEl.textContent = "ผิดพลาด: " + err.message;
  } finally {
    go.disabled = false;
  }
});

function render(results) {
  results.forEach((r, i) => {
    const el = document.createElement("div");
    const file = selected.find(f => f.name === r.name) || selected[i];
    const src = file ? URL.createObjectURL(file) : "";
    if (r.error) {
      el.className = "item";
      el.innerHTML = `<img src="${src}" alt=""><div class="info"><div class="name"></div><div class="label">⚠️ ${r.error}</div></div>`;
      el.querySelector(".name").textContent = r.name;
    } else {
      const infected = r.label === "Infected";
      const conf = (infected ? r.p_infected : r.p_fresh) * 100;
      el.className = "item " + (infected ? "infected" : "fresh");
      el.innerHTML = `
        <img src="${src}" alt="">
        <div class="info">
          <div class="name"></div>
          <div class="label">${infected ? "⚠️ Infected (ติดเชื้อ)" : "✅ Fresh (ปกติ)"}</div>
          <div class="bar"><span style="width:${(r.p_infected * 100).toFixed(1)}%"></span></div>
          <div class="pct">ความมั่นใจ ${conf.toFixed(1)}% · โอกาสติดเชื้อ ${(r.p_infected * 100).toFixed(1)}%</div>
        </div>`;
      el.querySelector(".name").textContent = r.name;
    }
    out.appendChild(el);
  });
}
</script>
</body>
</html>
